[project]
name = "ind320-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M03ZGH", email = "moezyadgar03@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cassandra-driver>=3.30.1",
    "entsoe-py>=0.8.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=2.2,<3",
    "pyarrow>=16.0.0",
    "plotly>=7.0.0",
    "pygments>=2.21.0",
    "pymongo>=4.19.0",
    "pyspark==3.5.8",
    "requests>=2.31.0",
    "setuptools<70",
    "streamlit>=1.63.0",
]

[project.scripts]
ind320-app = "ind320_app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
